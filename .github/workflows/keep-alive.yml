name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            "https://wkvqizyfetnzhwmabldc.supabase.co/rest/v1/schools?select=count")
          echo "Status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
